<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
     // padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: #fff;
      padding: 20px;
      padding-top: 70px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      position: relative;
      overflow: auto;
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    button:hover {
      background: #1e4ed8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    thead {
      background: #e5e7eb;
    }

    th, td {
      border: 1px solid #000;
      padding: 10px;
      text-align: left;
      text-transform: uppercase;
    }

    th {
      font-weight: bold;
    }

    tbody tr:nth-child(even) {
      background: #f9fafb;
    }

    /* PRINT STYLES */
    @media print {
      body {
        background: none;
        padding: 0;
      }

      button {
        display: none;
      }

      .container {
        box-shadow: none;
        border-radius: 0;
      }

      table {
        font-size: 12px;
      }
    }
  
  img.logo {
    height: 70px;
    width: 70px;
    display: inline-block;
    border-radius: 50%;
    position: absolute;
     top: 0;
    left: calc(50% - 70px/2);
  }
  </style>
</head>
<body>

  <div class="container">
    <img class="logo" src="../logo.png">
    <h1>Maiduguri Innovative School</h1>
    <h2><span id="cls"></span> Student Data
    <button onclick="window.print()">Print</button>
    </h2>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Student ID</th>
          <th>Gender</th>
        </tr>
      </thead>
      <tbody id="studentTableBody"></tbody>
    </table>
  </div>

  <script>
  
  const students = Object.values(JSON.parse(localStorage.getItem("students")));
  students.sort((a, b)=> a.name.localeCompare(b.name));
  const tbody = document.getElementById("studentTableBody");

    students.forEach((student, index) => {
      const row = document.createElement("tr");
      cls.innerHTML = student.class.toUpperCase();
      row.innerHTML = `
        <td>${index + 1}</td>
        <td>${student.name}</td>
        <td>${student.id}</td>
        <td>${student.gender}</td>
      `;

      tbody.appendChild(row);
    });
  </script>

</body>
</html>
